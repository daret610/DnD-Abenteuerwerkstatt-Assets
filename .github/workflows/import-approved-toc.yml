name: Import approved TOC vignette

on:
  push:
    paths:
      - '.github/workflows/import-approved-toc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved TOC vignette
        run: |
          mkdir -p adventures/der-taumelnde-greif/06_Sonstiges
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2980-8210-ac0e-e09468ce80ff/raw?se=2026-09-15T20%3A18%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=5b93fc91-a341-5b31-bebf-f348a676c19d&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T05%3A12%3A57Z&ske=2026-09-16T05%3A12%3A57Z&sks=b&skv=2026-02-06&sig=soLgeXm7aeWf/KYgW/0N63YD55xmyA9Yoa6g9SqiZYc%3D' -o adventures/der-taumelnde-greif/06_Sonstiges/TOC_Taumelnder_Greif_Vignette_APPROVED.png
          test -s adventures/der-taumelnde-greif/06_Sonstiges/TOC_Taumelnder_Greif_Vignette_APPROVED.png
          file adventures/der-taumelnde-greif/06_Sonstiges/TOC_Taumelnder_Greif_Vignette_APPROVED.png | grep -q 'PNG image data'

      - name: Commit approved asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adventures/der-taumelnde-greif/06_Sonstiges/TOC_Taumelnder_Greif_Vignette_APPROVED.png
          if git diff --cached --quiet; then
            echo 'Asset already current.'
          else
            git commit -m 'Add approved TOC vignette'
            git push
          fi
